# Name displayed in GitHub Actions
name: CI Pipeline - Lint & Test

# When the workflow should run
on:
  # Run on pull requests to dev
  pull_request:
    branches: [ "dev"]

  # Run on direct pushes to dev
  push:
    branches: [ "dev"]

# Prevent multiple pipelines running simultaneously on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security (read-only access)
permissions:
  contents: read

jobs:

  # -------------------------------------------------
  # LINT JOB
  # -------------------------------------------------
  lint:
    name: Lint (Format & Code Style)
    runs-on: ubuntu-latest

    steps:
      # Checkout repository code
      - uses: actions/checkout@v4

      # Set up Java 17 (required for Spring Boot)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # Run Checkstyle rules (naming, formatting, structure, complexity)
      # Fails if any rule is violated
      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

  # -------------------------------------------------
  # TEST JOB
  # -------------------------------------------------
  test:
    name: Build & Unit Tests + JaCoCo
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ## JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      # Checkout repository code
      - uses: actions/checkout@v4

      # Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Build the project and run unit tests
      # JaCoCo automatically measures code coverage
      - name: Build & Test (Maven Wrapper)
        # run: |
        #  ./mvnw -B clean verify -Dspring.profiles.active=ci
        run: |
          ./mvnw -B clean verify

      # Upload JUnit test reports (always, even if tests fail)
      - name: Upload test reports (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # Upload JaCoCo coverage report
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
